name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One place to bump the newosp baseline. The server requires the checked
# POSIX thread startup (OSP_THREAD_POSIX_CHECKED_START), so a stale pin fails
# at configure time instead of on a board.
env:
  NEWOSP_REPOSITORY: DeguiLiu/newosp
  NEWOSP_REF: 5ef966c15ba7b4805dc70e65cc3b7fc2115bc862

jobs:
  host-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, RelWithDebInfo ]
        connections: [ 4, 16 ]

    steps:
      - uses: actions/checkout@v5

      - name: Checkout newosp
        uses: actions/checkout@v5
        with:
          repository: ${{ env.NEWOSP_REPOSITORY }}
          # Baseline pinned by the design document.
          ref: ${{ env.NEWOSP_REF }}
          path: newosp

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DRS_MAX_CONNECTIONS=${{ matrix.connections }} \
            -DNEWOSP_DIR="${{ github.workspace }}/newosp" \
            -DRS_BUILD_E2E=ON \
            -DRS_ENABLE_DEBUG_SHELL=ON \
            -DRS_ENABLE_FAULT_INJECTION=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  minimal-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Checkout newosp
        uses: actions/checkout@v5
        with:
          repository: ${{ env.NEWOSP_REPOSITORY }}
          ref: ${{ env.NEWOSP_REF }}
          path: newosp

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEWOSP_DIR="${{ github.workspace }}/newosp" \
            -DRS_BUILD_E2E=OFF \
            -DRS_ENABLE_DEBUG_SHELL=OFF \
            -DRS_ENABLE_FAULT_INJECTION=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Checkout newosp
        uses: actions/checkout@v5
        with:
          repository: ${{ env.NEWOSP_REPOSITORY }}
          ref: ${{ env.NEWOSP_REF }}
          path: newosp

      # ASan cannot map its shadow under kernel 6.5+ high-entropy ASLR
      # (vm.mmap_rnd_bits=32); binaries otherwise die with DEADLYSIGNAL
      # before main().
      - name: Reduce ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure (ASan/UBSan)
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEWOSP_DIR="${{ github.workspace }}/newosp" \
            -DRS_BUILD_E2E=OFF \
            -DRS_ENABLE_DEBUG_SHELL=OFF \
            -DRS_ENABLE_FAULT_INJECTION=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san -j"$(nproc)"

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Checkout newosp
        uses: actions/checkout@v5
        with:
          repository: ${{ env.NEWOSP_REPOSITORY }}
          ref: ${{ env.NEWOSP_REF }}
          path: newosp

      - name: Reduce ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure (TSan)
        run: |
          cmake -S . -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEWOSP_DIR="${{ github.workspace }}/newosp" \
            -DRS_BUILD_E2E=OFF \
            -DRS_ENABLE_DEBUG_SHELL=OFF \
            -DRS_ENABLE_FAULT_INJECTION=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan -j"$(nproc)"

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: setarch "$(uname -m)" -R ctest --test-dir build-tsan --output-on-failure

  # aarch64 Linux: the second supported target platform (the first is
  # x86-64). The job cross-compiles the whole tree and then EXECUTES the
  # test binaries under qemu-user, so it catches target-ABI defects that a
  # compile-only gate cannot: atomic lock-freedom, alignment assumptions
  # (alignas(64) cache lines), size_t / pointer width and endianness.
  #
  # The compile half of this gate is what makes the "no atomic<uint64_t> on
  # armhf" class of bug fail here instead of on a board.
  arm-linux-aarch64:
    name: arm-linux (aarch64, qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Checkout newosp
        uses: actions/checkout@v5
        with:
          repository: ${{ env.NEWOSP_REPOSITORY }}
          ref: ${{ env.NEWOSP_REF }}
          path: newosp

      - name: Install the aarch64 cross toolchain and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            qemu-user

      - name: Configure (aarch64 cross)
        run: |
          cmake -S . -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-linux-gnu.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEWOSP_DIR="${{ github.workspace }}/newosp" \
            -DRS_BUILD_E2E=OFF \
            -DRS_ENABLE_DEBUG_SHELL=OFF \
            -DRS_ENABLE_FAULT_INJECTION=OFF

      - name: Build
        run: cmake --build build-arm64 -j"$(nproc)"

      # CMAKE_CROSSCOMPILING_EMULATOR in the toolchain file makes ctest run
      # every test binary through qemu-aarch64.
      - name: Test under qemu-aarch64
        run: ctest --test-dir build-arm64 --output-on-failure

      - name: Report the target architecture
        run: |
          # A silent fallback to the host compiler would make this job green
          # while testing x86 binaries. Prove the artifacts are aarch64.
          file build-arm64/rtspserver_demo
          if ! file build-arm64/rtspserver_demo | grep -q "ARM aarch64"; then
            echo "FAIL: rtspserver_demo was not built for aarch64" >&2
            exit 1
          fi

      # The zero-heap contract, checked on the target architecture. On armhf a
      # 64-bit atomic silently falls back to libatomic (a lock plus a heap
      # allocation), which this audit is designed to catch.
      - name: Zero-heap symbol audit
        run: bash test/elf_audit.sh aarch64-linux-gnu-nm build-arm64/CMakeFiles/rs_core.dir/src/*.o

  # armhf (32-bit ARM) is the worst case for this code base: it is the only
  # supported target where std::atomic<uint64_t> is not lock-free by default,
  # so a careless atomic turns into a libatomic lock plus heap allocation.
  # The job compiles with the distro armv7 hard-float ABI and executes every
  # test under qemu-arm-aarch32, which also exercises the 32-bit size_t and
  # pointer-width paths.
  arm-linux-armhf:
    name: arm-linux (armhf, qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Checkout newosp
        uses: actions/checkout@v5
        with:
          repository: ${{ env.NEWOSP_REPOSITORY }}
          ref: ${{ env.NEWOSP_REF }}
          path: newosp

      - name: Install the armhf cross toolchain and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-arm-linux-gnueabihf gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross linux-libc-dev-armhf-cross \
            qemu-user

      - name: Configure (armhf cross)
        run: |
          cmake -S . -B build-armhf \
            -DCMAKE_TOOLCHAIN_FILE=cmake/armhf-linux-gnueabihf.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNEWOSP_DIR="${{ github.workspace }}/newosp" \
            -DRS_BUILD_E2E=OFF \
            -DRS_ENABLE_DEBUG_SHELL=OFF \
            -DRS_ENABLE_FAULT_INJECTION=OFF

      - name: Build
        run: cmake --build build-armhf -j"$(nproc)"

      # CMAKE_CROSSCOMPILING_EMULATOR in the toolchain file makes ctest run
      # every test binary through qemu-arm.
      - name: Test under qemu-arm
        run: ctest --test-dir build-armhf --output-on-failure

      - name: Report the target architecture
        run: |
          # Guard against a silent fallback to the host compiler.
          file build-armhf/rtspserver_demo
          if ! file build-armhf/rtspserver_demo | grep -q "32-bit LSB.*ARM"; then
            echo "FAIL: rtspserver_demo was not built for 32-bit ARM" >&2
            exit 1
          fi

      - name: Zero-heap symbol audit
        run: bash test/elf_audit.sh arm-linux-gnueabihf-nm build-armhf/CMakeFiles/rs_core.dir/src/*.o

  # Format, lint and static-analysis gate. coact keeps these in .ai/ scripts
  # that only run locally; osp-rtspserver runs them in CI so the gate cannot
  # rot into a tool nobody executes.
  static-analysis:
    name: format + lint + tidy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Checkout newosp
        uses: actions/checkout@v5
        with:
          repository: ${{ env.NEWOSP_REPOSITORY }}
          ref: ${{ env.NEWOSP_REF }}
          path: newosp

      # The tools are pinned: clang-format output changes between LLVM
      # releases, so an unpinned runner image turns a green gate red without
      # any source change. Bump these versions and reformat in one commit.
      - name: Install the analysis tools
        run: |
          python3 -m pip install --user \
            clang-format==21.1.8 clang-tidy==21.1.6 cpplint

      - name: clang-format
        run: bash .ai/format.sh --check

      - name: cpplint
        run: bash .ai/lint.sh

      - name: clang-tidy
        env:
          # tidy.sh defaults to <repo>/../newosp, but CI checks newosp out
          # inside the workspace, so the path must be passed explicitly.
          RS_NEWOSP_DIR: ${{ github.workspace }}/newosp
        run: bash .ai/tidy.sh
